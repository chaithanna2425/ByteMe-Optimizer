[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ByteMe-Optimizer"
version = "0.1.0"
description = "Configuration-driven manufacturing energy optimization"
readme = "optimizer/README.md"
requires-python = ">=3.10"
dependencies = ["ortools==9.15.6755"]

[project.optional-dependencies]
test = ["pytest>=8", "jsonschema>=4"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["optimizer"]
