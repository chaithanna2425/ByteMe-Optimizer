name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q

  optimizer-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[test]"
      - run: python -m pip install build mypy ruff
      - run: python -m mypy optimizer --ignore-missing-imports
      - run: python -m compileall -q optimizer tests
      - run: python -m pip check
      - run: python -m ruff check optimizer/verification.py optimizer/resource_limits.py tests/test_schedule_verification.py tests/package_smoke.py
      - run: python -m build --wheel --sdist --outdir "$RUNNER_TEMP/dist"
      - run: python -m pip install --no-deps --target "$RUNNER_TEMP/wheel-target" "$RUNNER_TEMP"/dist/*.whl
      - name: Smoke-test installed wheel
        env:
          PYTHONPATH: ${{ runner.temp }}/wheel-target
          BYTEME_WHEEL_TARGET: ${{ runner.temp }}/wheel-target
        run: python tests/package_smoke.py
